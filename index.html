<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Redirigiendo a reseña...</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 80vh;
      margin: 0;
      color: #333;
      text-align: center;
    }
  </style>
  <script>
    // Diccionario de negocios y sus enlaces de reseña directa
    const destinos = {
      "tintoreria": "https://www.google.com/maps/place/Tintoreria+Hollywood+I/@19.6387489,-99.2179942,21z/",
      "barberia_norte": "https://search.google.com/local/writereview?placeid=ChIJVzdOg2ke0oUR3hMsN96Y4-c"
    };

    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    if (id && destinos[id]) {
      window.location.href = destinos[id];
    } else {
      window.onload = function() {
        document.body.innerHTML = "<h3 style='color:#d93025;'>Negocio no encontrado o ID no especificado.</h3>";
      };
    }
  </script>
</head>
<body>
  <p>Abriendo formulario de reseña...</p>
</body>
</html>
